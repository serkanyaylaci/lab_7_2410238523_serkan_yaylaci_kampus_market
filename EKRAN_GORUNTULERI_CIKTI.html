<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Serkan Yaylacı - 2410238523 - Kampüs Market Ekran Görüntüleri</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 10mm;
    }
    *, *:before, *:after {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #cbd5e1;
      margin: 0;
      padding: 20px 0;
    }

    .toolbar {
      max-width: 210mm;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: flex-end;
    }
    .btn-print {
      cursor: pointer;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      background: #2563eb;
      color: #ffffff;
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .btn-print:hover {
      background: #1d4ed8;
    }

    /* A4 YAPRAK */
    .sheet {
      width: 210mm;
      height: 275mm;
      max-height: 275mm;
      margin: 0 auto 20px auto;
      background: #ffffff;
      padding: 8mm 12mm 12mm 12mm;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      page-break-after: always;
      break-after: page;
      page-break-inside: avoid;
      break-inside: avoid;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* YALNIZCA SAĞ ÜSTTEKİ AD SOYAD BÖLÜMÜ */
    .top-header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .student-info {
      text-align: right;
      font-size: 13px;
      color: #0f172a;
      line-height: 1.3;
    }
    .student-info strong {
      font-size: 14px;
      font-weight: 800;
    }
    .student-info span {
      color: #475569;
      font-weight: 600;
    }

    /* İKİLİ YARI YARIYA (50% - 50%) RESİMLER */
    .row {
      display: flex;
      gap: 14px;
      flex: 1;
      height: 245mm;
      max-height: 245mm;
      align-items: center;
    }
    .col {
      flex: 1;
      width: 50%;
      height: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .col img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
    }

    @media print {
      body {
        background: transparent !important;
        padding: 0 !important;
      }
      .toolbar {
        display: none !important;
      }
      .sheet {
        margin: 0 !important;
        padding: 6mm 10mm 10mm 10mm !important;
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        height: 275mm !important;
        max-height: 275mm !important;
        page-break-after: always !important;
        break-after: page !important;
      }
      .row {
        height: 250mm !important;
        max-height: 250mm !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

  <!-- YAZDIRMA BUTONU (Baskıda görünmez) -->
  <div class="toolbar">
    <button class="btn-print" onclick="window.print()">🖨️ Yazdır / PDF Olarak Kaydet (Ctrl + P)</button>
  </div>

  <!-- ================= YAPRAK 1 ================= -->
  <div class="sheet">
    <div class="top-header">
      <div class="student-info">
        <strong>Ad Soyad:</strong> <span>Serkan Yaylacı</span><br/>
        <strong>Öğrenci No:</strong> <span>2410238523</span>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <img src="ekran_goruntuleri/11_kampus_market_urunler.png" alt="Kampüs Market - Ürünler Listesi">
      </div>
      <div class="col">
        <img src="ekran_goruntuleri/12_kampus_market_bos_sepet.png" alt="Kampüs Market - Sepetim (Boş Sepet)">
      </div>
    </div>
  </div>

</body>
</html>
